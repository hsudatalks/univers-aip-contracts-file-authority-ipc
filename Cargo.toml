[package]
name = "univers-aip-contracts-file-authority-ipc"
version = "0.1.3"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Pure File authority IPC requests, replies and protocol bounds"
repository = "https://github.com/hsudatalks/univers-aip-contracts-file-authority-ipc"
publish = ["univers"]
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "README.md", "src/**", "tests/**", "scripts/**", ".cargo/config.toml"]
[workspace]
members = ["."]
resolver = "2"
[dependencies]
serde = { version = "1", features = ["derive"] }
univers-aip-contracts-data = { version = ">=1.0.0-rc.2, <1.0.0", registry = "univers", default-features = false, features = ["content-types", "file", "file-authority"] }
[dev-dependencies]
serde_json = "1"
rmp-serde = "1"
