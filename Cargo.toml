[package]
name = "univers-aip-contracts-file-authority-ipc"
version = "0.1.14"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Pure File authority IPC requests, replies and protocol bounds"
repository = "https://github.com/hsudatalks/univers-aip-contracts-file-authority-ipc"
publish = ["univers"]
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "README.md", "CONTENT_RETENTION.md", "CONTENT_WORLD_VERIFIER.md", "CONTENT_WORLD_POLICY_PROJECTION.md", "src/**", "tests/**", "scripts/**", ".cargo/config.toml"]
[workspace]
members = ["."]
resolver = "2"
[features]
default = []
capability = ["dep:bytes", "univers-aip-contracts-data/file-file"]
retention = ["univers-aip-contracts-data/file-artifact", "dep:univers-aip-contracts-world-ipc", "dep:rmp-serde", "dep:serde_json", "dep:sha2"]
world-verifier = ["retention"]
world-policy-projection = ["world-verifier", "dep:univers-file-governed-policy"]
[dependencies]
bytes = { version = "1", features = ["serde"], optional = true }
serde = { version = "1", features = ["derive"] }
univers-aip-contracts-data = { version = "=1.0.0-rc.3", registry = "univers", default-features = false, features = ["content-types", "file", "file-authority", "storage-full"] }
rmp-serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
univers-aip-contracts-world-ipc = { version = "=0.3.12-dev.12", registry = "univers", default-features = false, features = ["spatial-mutation"], optional = true }
univers-file-governed-policy = { version = "=0.1.0-dev.6", registry = "univers", optional = true }
[dev-dependencies]
serde_json = "1"
rmp-serde = "1"
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
univers-aip-lib-kv-redb = { version = "=1.0.0-dev.3", registry = "univers" }
univers-aip-contracts-shared = { version = "=1.0.0-rc.2", registry = "univers", default-features = false, features = ["artifact-ref"] }

[profile.release-workbench]
inherits = "release"
